<footer class="site-footer h-card">
  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col">
        <div>{{ site.description | escape }}.</div>
        <p>
          © {{ site.time | date: "%Y" }} {{ site.author.name | escape }}, chyba
          że nie
        </p>
        <p class="privacy-links">
          {% include about-privacy.html %}
          <span data-privacy-controls hidden>
            ·
            <a href="#privacy-panel" data-privacy-settings hidden>
              Ustawienia prywatności
            </a>
          </span>
        </p>
                
      </div>
    </div>

    <div class="social-links">{% include social.html %}</div>
  </div>
</footer>
<script data-turbo-eval="false">
  (() => {
    const loadTurbo = () => {
      const start = () => {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = "{{ '/assets/js/turbo.es2017-esm.min.js' | relative_url }}";
        document.head.append(script);
      };
      if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 2000 });
      else setTimeout(start, 0);
    };
    if (document.readyState === 'complete') loadTurbo();
    else window.addEventListener('load', loadTurbo, { once: true });
  })();
</script>
