<div class="youtube-embed" data-video-id="{{ include.id | escape }}" data-video-title="{{ include.title | default: 'YouTube' | escape }}">
  <div class="youtube-placeholder">
    <p><a href="https://www.youtube.com/watch?v={{ include.id | escape }}" rel="noreferrer">{{ include.title | default: 'Film YouTube' | escape }}</a></p>
    <p>Włączenie filmu połączy Cię z YouTube. Google otrzyma informacje o odtwarzaniu filmu i Twoim połączeniu.</p>
    <p class="privacy-links">
      {% include about-privacy.html %}
      <span data-privacy-controls hidden>
        ·
        <a href="#privacy-panel" data-privacy-settings hidden>Ustawienia prywatności</a>
      </span>
    </p>
    <button type="button" data-video-consent hidden>Zgadzam się, włącz</button>
  </div>
</div>
