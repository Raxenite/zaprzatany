<div class="youtube-embed">
  <iframe
    src="https://www.youtube-nocookie.com/embed/{{ include.id | escape }}"
    title="{{ include.title | default: 'YouTube' | escape }}"
    loading="lazy"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
</div>
