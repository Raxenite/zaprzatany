<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  {%- if page.collection == 'posts' -%}
    {%- include post-seo.html -%}
  {%- else -%}
    {%- seo -%}
  {%- endif -%}
  {%- if page.url == '/404.html' -%}
    <meta name="robots" content="noindex">
  {%- endif -%}
  <script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="1609d94e-4c69-4b96-bdca-2387c74f844d"
  ></script>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/fonts/ibm-plex/fonts.css' | relative_url }}">
  <link id="main-stylesheet" rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  
<link rel="stylesheet" href="{{ '/assets/fonts/fontawesome/all.min.css' | relative_url }}">
</head>
